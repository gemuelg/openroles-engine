name: Scheduled Job Pipeline Sync

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  # Allows triggering manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Execute ATS Ingestion & Enrichment Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: "production"
        run: |
          echo "🔄 Running ATS ingestion pipeline..."
          npx tsx src/sync.ts
          echo "⚡ Running salary enrichment pipeline..."
          npx tsx src/enrich.ts
          echo "✅ Scheduled job pipeline completed successfully."
